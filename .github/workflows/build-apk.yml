name: Release Vibetube
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"
      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Configure VIBE_KEYSTORE_BASE64 and the release password secrets"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/Vibetube-release.jks"
      - name: Test and build release
        env:
          VIBE_KEYSTORE_FILE: ${{ runner.temp }}/Vibetube-release.jks
          VIBE_STORE_PASSWORD: ${{ secrets.VIBE_STORE_PASSWORD }}
          VIBE_KEY_ALIAS: vibetube
          VIBE_KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Vibetube.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vibetube-v1.0
          path: |
            Vibetube.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vibetube ${{ github.ref_name }}
          files: Vibetube.apk
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/Vibetube-release.jks"
