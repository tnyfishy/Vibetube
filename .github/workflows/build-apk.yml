name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          tail -n 300 build.log
          if [ "$code" -ne 0 ]; then
            # Surface the real errors as annotations so they are visible without opening raw logs.
            grep -E '^e: ' build.log | head -9 | while IFS= read -r line; do
              echo "::error title=Kotlin error::${line}"
            done
            msg="$(grep -A14 'What went wrong' build.log | head -16 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Gradle::${msg}"
          fi
          exit "$code"

      # Optimised build (R8 + resource shrinking + baseline profile): much smoother and lighter than the debug APK.
      # Published as an extra asset; if it fails the debug APK still ships.
      - name: Build optimized release APK
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleRelease --stacktrace > release.log 2>&1
          code=$?
          tail -n 60 release.log
          if [ "$code" -ne 0 ]; then
            grep -E '^e: |error:' release.log | head -9 | while IFS= read -r line; do
              echo "::error title=Release build::${line:0:400}"
            done
            msg="$(grep -A12 'What went wrong' release.log | head -14 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Release Gradle::${msg}"
          fi
          exit "$code"

      - name: Name the APK
        id: apk
        run: |
          short="$(git rev-parse --short HEAD)"
          out="vibetube-debug-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          rel="vibetube-release-${short}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$rel"
            echo "release=$rel" >> "$GITHUB_OUTPUT"
          else
            echo "release=$out" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=build-${GITHUB_RUN_NUMBER}-${short}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vibetube-debug-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.release }}
          if-no-files-found: error

      - name: Publish to GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Vibetube debug ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.release }}
          body: |
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.
            `vibetube-release-*.apk` = optimized build (R8 + baseline profile, smoother/lighter); `vibetube-debug-*.apk` = debug build.

      # Unit tests run after the APK is published so a flaky test never blocks the download.
      - name: Unit tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      # Surface unit-test failures as annotations (the step above is allowed to fail without blocking the APK).
      - name: Report test failures
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/unit-tests.log"
          [ -f "$log" ] || exit 0
          { grep -E "^e: |FAILED|AssertionError|What went wrong|Compilation error|error:" -A2 "$log" || true; } | head -40 | while IFS= read -r line; do
            echo "::error title=unit tests::${line:0:500}"
          done
          exit 0
