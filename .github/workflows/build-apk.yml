name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          tail -n 300 build.log
          if [ "$code" -ne 0 ]; then
            # Surface the real errors as annotations so they are visible without opening raw logs.
            grep -E '^e: ' build.log | head -9 | while IFS= read -r line; do
              echo "::error title=Kotlin error::${line}"
            done
            msg="$(grep -A14 'What went wrong' build.log | head -16 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Gradle::${msg}"
          fi
          exit "$code"

      - name: Name the APK
        id: apk
        run: |
          short="$(git rev-parse --short HEAD)"
          out="vibetube-debug-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_NUMBER}-${short}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vibetube-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish to GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Vibetube debug ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            Debug APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

      # Unit tests run after the APK is published so a flaky test never blocks the download.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Surface unit-test failures as annotations (the step above is allowed to fail without blocking the APK).
      - name: Report test failures
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -A3 "<testcase" "$f" | grep -B1 -A2 "<failure" | tr '\n' ' ' | sed 's/<testcase/\n<testcase/g' | grep "<failure" | while IFS= read -r line; do
              echo "::error title=unit test failed::${line:0:600}"
            done
          done
          exit 0
